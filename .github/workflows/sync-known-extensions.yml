name: Sync KnownExtensions N-1

on:
  schedule:
    # 每天台灣時間凌晨 03:15 執行
    - cron: "15 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-known-extensions
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v6

      - name: Download upstream repository
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/DFFspace/CryptoBlocker.git \
            upstream

          cd upstream
          git checkout master

      - name: Select KnownExtensions version
        id: sync
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_FILE="KnownExtensions.txt"
          STATE_FILE=".known-extensions-upstream-sha"

          cd upstream
          mapfile -t COMMITS < <(
            git log --format="%H" -- "$SOURCE_FILE"
          )

          if [ "${#COMMITS[@]}" -eq 0 ]; then
            echo "找不到上游 KnownExtensions.txt"
            exit 1
          fi

          LATEST_SHA="${COMMITS[0]}"
          cd ..

          if [ ! -f "$STATE_FILE" ]; then
            # 第一次執行：同步上游最新版
            SELECTED_SHA="$LATEST_SHA"
            SYNC_TYPE="initial"
          else
            LAST_SEEN_SHA="$(tr -d '\r\n ' < "$STATE_FILE")"

            if [ "$LAST_SEEN_SHA" = "$LATEST_SHA" ]; then
              echo "上游沒有新版本"
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "${#COMMITS[@]}" -lt 2 ]; then
              echo "找不到上游 N-1 版本"
              exit 1
            fi

            # 後續執行：同步上游目前版本的前一版
            SELECTED_SHA="${COMMITS[1]}"
            SYNC_TYPE="n-1"
          fi

          git -C upstream show \
            "${SELECTED_SHA}:${SOURCE_FILE}" \
            > KnownExtensions.txt

          printf '%s\n' "$LATEST_SHA" > "$STATE_FILE"

          echo "selected_sha=$SELECTED_SHA" >> "$GITHUB_OUTPUT"
          echo "sync_type=$SYNC_TYPE" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add KnownExtensions.txt .known-extensions-upstream-sha

          if git diff --cached --quiet; then
            echo "檔案內容沒有變更"
            exit 0
          fi

          git commit -m \
            "Sync KnownExtensions (${{ steps.sync.outputs.sync_type }}): ${{ steps.sync.outputs.selected_sha }}"

          git push
